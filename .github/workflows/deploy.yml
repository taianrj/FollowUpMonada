name: Deploy automatico na Oracle Cloud

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Verificar e publicar
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Verificar testes e build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: |
          npm ci
          npm --prefix whatsapp-service ci
          npm test
          npm run build

      - name: Publicar via SSH
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: GITHUB_TOKEN,DEPLOY_SHA
          script_stop: true
          script: |
            set -eu

            deploy_source="$(mktemp -d)"
            archive_path="$deploy_source/source.tar.gz"
            trap 'rm -rf "$deploy_source"' EXIT

            curl --fail --silent --show-error --location \
              --retry 8 \
              --retry-delay 5 \
              --retry-max-time 120 \
              --retry-all-errors \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/taianrj/FollowUpMonada/tarball/$DEPLOY_SHA" \
              --output "$archive_path"
            tar -xzf "$archive_path" --strip-components=1 --directory "$deploy_source"
            rm -f "$archive_path"

            sudo docker build -t followup-whatsapp "$deploy_source/whatsapp-service"
            sudo docker stop followup-whatsapp || true
            sudo docker rm followup-whatsapp || true

            # O container executa sem root e escreve somente no volume persistente.
            sudo mkdir -p /home/ubuntu/followup/whatsapp-service/data
            sudo chown -R 1000:1000 /home/ubuntu/followup/whatsapp-service/data

            sudo docker run -d \
              --name followup-whatsapp \
              --restart always \
              -p 127.0.0.1:8080:8080 \
              -v /home/ubuntu/followup/whatsapp-service/data:/app/data \
              --env-file /home/ubuntu/followup/whatsapp-service/.env \
              followup-whatsapp
