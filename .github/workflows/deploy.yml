name: Deploy automatico na Oracle Cloud

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Verificar e publicar
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Verificar testes e build
        run: |
          npm ci
          npm --prefix whatsapp-service ci
          npm test
          npm run build

      - name: Publicar via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            cd /home/ubuntu/followup

            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com/taianrj/FollowUpMonada.git
            else
              git remote set-url origin https://github.com/taianrj/FollowUpMonada.git
            fi
            git fetch --prune origin main
            git checkout -B main origin/main

            sudo docker build -t followup-whatsapp ./whatsapp-service
            sudo docker stop followup-whatsapp || true
            sudo docker rm followup-whatsapp || true

            # O container executa sem root e escreve somente no volume persistente.
            sudo mkdir -p /home/ubuntu/followup/whatsapp-service/data
            sudo chown -R 1000:1000 /home/ubuntu/followup/whatsapp-service/data

            sudo docker run -d \
              --name followup-whatsapp \
              --restart always \
              -p 127.0.0.1:8080:8080 \
              -v /home/ubuntu/followup/whatsapp-service/data:/app/data \
              --env-file /home/ubuntu/followup/whatsapp-service/.env \
              followup-whatsapp
